name: Q-SHIELD Quality Gate

on:
  push:
    branches:
      - main
      - integration
      - "version-*"
      - Aditya-Singh-AIML
  pull_request:
    branches:
      - main
      - integration
      - "version-*"
      - Aditya-Singh-AIML
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bytecode compilation & syntax check
        run: |
          python - <<'PYTHON'
          import pathlib
          import py_compile
          import subprocess

          # Compile checked-in Python modules/tests, not generated or scanned inputs.
          paths = subprocess.check_output(["git", "ls-files", "-z", "--", "*.py"]).decode().split("\0")
          for name in filter(None, paths):
              if pathlib.Path(name).is_file():
                  py_compile.compile(name, doraise=True)
          PYTHON

      - name: Run automated test suite
        run: |
          python -m unittest discover -s . -p "test_*.py" -v

      - name: Formally validate representative CBOM exports offline
        run: python tools/validate_cbom_exports.py

  dashboard-assets:
    name: Verify committed dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node tools/build-web.mjs --check
